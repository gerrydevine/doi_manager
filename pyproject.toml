[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doi-manager"
version = "0.1.0"
description = "Models and DataCite helpers for working with DOI metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/your-org/doi_manager"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["doi_manager*"]
